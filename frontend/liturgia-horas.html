<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

<!-- Liturgia das Horas (liturgia-horas.html?data=AAAA-MM-DD) -->

      <div class="fd-trilho fd-trilho--dir" aria-hidden="true"></div>
      <div class="fd-container fd-pagina">
        <div id="topo-da-pagina"></div>
        <div class="fd-blocos" id="conteudo-da-liturgia"></div>
      </div>

    <!-- o rodapé entra aqui (layout.js) -->
