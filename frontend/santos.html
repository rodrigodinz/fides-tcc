<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Fides: santos, orações, novenas, livros e liturgia em um só lugar.">
  <meta name="theme-color" content="#EEE8DC">
  <link rel="icon" type="image/svg+xml" href="/imagens/simbolo-fides.svg">
  <title>Santos · Fides</title>
  <link rel="stylesheet" href="/css/fontes.css">
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/componentes.css">
  <link rel="stylesheet" href="/css/paginas.css">
  <script type="module" src="/js/paginas/santos.js"></script>
</head>
<!-- LISTA DE TODOS OS SANTOS E BUSCA POR ID, NOME, ETC (santos.html?nome=...&pagina=...) -->
<body data-modulo="santos">
  <div class="estrutura-do-site">
    <a href="#conteudo" class="link-pular-para-o-conteudo">Pular para o conteúdo</a>
    <!-- a navbar e o menu lateral entram aqui (layout.js) -->
    <main id="conteudo" tabindex="-1" class="conteudo-principal">
      <div class="trilho-ornamental trilho-ornamental-da-esquerda" aria-hidden="true"></div>
      <div class="trilho-ornamental trilho-ornamental-da-direita" aria-hidden="true"></div>
      <div class="area-centralizada espacamento-da-pagina">
        <header class="cabecalho-da-pagina">
          <img class="ornamento ornamento-de-titulo" src="/imagens/ornamentos/titulo-familia-b.svg" width="516" height="40" alt="" aria-hidden="true">
          <h1 class="titulo-da-pagina">Santos</h1>
          <p class="texto-de-abertura-do-cabecalho">Conheça a vida de cada santo e as orações, novenas e livros ligados a ele.</p>
        </header>
        <div class="largura-de-leitura" style="margin:32px auto 0">
          <div class="campo-de-formulario">
            <label for="busca-santo">Buscar santo</label>
            <div class="campo-de-busca" role="search"><svg class="icone" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="11" cy="11" r="6.5"></circle><path d="M20 20l-4.2-4.2"></path></svg><input id="busca-santo" class="caixa-de-texto" type="search" placeholder="Nome do santo, ex.: Tomás" autocomplete="off" spellcheck="false" aria-describedby="busca-santo-ajuda"><button type="button" class="botao-de-icone botao-de-limpar-a-busca" aria-label="Limpar busca" data-limpar-busca hidden><svg class="icone" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6 6l12 12M18 6L6 18"></path></svg></button></div>
            <span id="busca-santo-ajuda" class="texto-auxiliar">Acentos e maiúsculas não fazem diferença.</span>
          </div>
        </div>
        <!-- resultados da busca que é preenchido pelo santos.js -->
        <section class="secao" aria-label="Resultados" id="resultados"></section>
      </div>
    </main>
    <!-- o rodapé entra aqui (layout.js) -->
  </div>
  <noscript>O Fides precisa de JavaScript habilitado para funcionar.</noscript>
</body>
</html>
