<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Fides: santos, orações, novenas, livros e liturgia em um só lugar.">
  <meta name="theme-color" content="#EEE8DC">
  <link rel="icon" type="image/svg+xml" href="/imagens/simbolo-fides.svg">
  <title>Santos · Fides</title>
  <!-- estilos: fontes, cores e medidas (tokens), base, componentes e páginas -->
  <link rel="stylesheet" href="/css/fontes.css">
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/componentes.css">
  <link rel="stylesheet" href="/css/paginas.css">
  <!-- type="module": o script pode usar import/export e só roda depois que o HTML terminou de carregar -->
  <script type="module" src="/js/paginas/santos.js"></script>
</head>
<!-- Lista e busca de santos (santos.html?nome=...&pagina=...) -->
<!-- data-modulo diz qual link do menu fica marcado como página atual -->
<body data-modulo="santos">
  <div class="fd-app">
    <a href="#conteudo" class="fd-pular">Pular para o conteúdo</a>
    <!-- a navbar e o menu lateral entram aqui (layout.js) -->
    <main id="conteudo" tabindex="-1" class="fd-principal">
      <div class="fd-trilho fd-trilho--esq" aria-hidden="true"></div>
      <div class="fd-trilho fd-trilho--dir" aria-hidden="true"></div>
      <div class="fd-container fd-pagina">
        <header class="fd-cabecalho">
          <img class="fd-orn fd-orn--titulo" src="/imagens/ornamentos/titulo-familia-b.svg" width="516" height="40" alt="" aria-hidden="true">
          <h1 class="fd-h1">Santos</h1>
          <p class="fd-cabecalho__lead">Conheça a vida de cada santo e as orações, novenas e livros ligados a ele.</p>
        </header>
        <div class="fd-leitura" style="margin:32px auto 0">
          <div class="fd-campo">
            <label for="busca-santo">Buscar santo</label>
            <div class="fd-busca" role="search"><svg class="fd-ico" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="11" cy="11" r="6.5"></circle><path d="M20 20l-4.2-4.2"></path></svg><input id="busca-santo" class="fd-input" type="search" placeholder="Nome do santo, ex.: Tomás" autocomplete="off" spellcheck="false" aria-describedby="busca-santo-ajuda"><button type="button" class="fd-botao-icone fd-busca__limpar" aria-label="Limpar busca" data-limpar-busca hidden><svg class="fd-ico" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6 6l12 12M18 6L6 18"></path></svg></button></div>
            <span id="busca-santo-ajuda" class="fd-aux">Acentos e maiúsculas não fazem diferença.</span>
          </div>
        </div>
        <!-- resultados da busca: preenchido pelo santos.js -->
        <section class="fd-secao" aria-label="Resultados" id="resultados"></section>
      </div>
    </main>
    <!-- o rodapé entra aqui (layout.js) -->
  </div>
  <noscript>O Fides precisa de JavaScript habilitado para funcionar.</noscript>
</body>
</html>
