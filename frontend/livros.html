<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Fides: santos, orações, novenas, livros e liturgia em um só lugar.">
  <meta name="theme-color" content="#EEE8DC">
  <link rel="icon" type="image/svg+xml" href="/imagens/simbolo-fides.svg">
  <title>Livros · Fides</title>
  <!-- estilos: fontes, cores e medidas (tokens), base, componentes e páginas -->
  <link rel="stylesheet" href="/css/fontes.css">
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/componentes.css">
  <link rel="stylesheet" href="/css/paginas.css">
  <!-- type="module": o script pode usar import/export e só roda depois que o HTML terminou de carregar -->
  <script type="module" src="/js/paginas/livros.js"></script>
</head>
<!-- Livros: recomendações e catálogo (livros.html?santo=...&pagina=...) -->
<!-- data-modulo diz qual link do menu fica marcado como página atual -->
<body data-modulo="livros">
  <div class="estrutura-do-site">
    <a href="#conteudo" class="link-pular-para-o-conteudo">Pular para o conteúdo</a>
    <!-- a navbar e o menu lateral entram aqui (layout.js) -->
    <main id="conteudo" tabindex="-1" class="conteudo-principal">
      <div class="trilho-ornamental trilho-ornamental-da-esquerda" aria-hidden="true"></div>
      <div class="trilho-ornamental trilho-ornamental-da-direita" aria-hidden="true"></div>
      <div class="area-centralizada espacamento-da-pagina">
        <header class="cabecalho-da-pagina">
          <img class="ornamento ornamento-de-titulo" src="/imagens/ornamentos/titulo-familia-b.svg" width="516" height="40" alt="" aria-hidden="true">
          <h1 class="titulo-da-pagina">Livros</h1>
          <p class="texto-de-abertura-do-cabecalho">Obras dos santos e textos importantes da fé, com resumo e contexto histórico.</p>
        </header>
        <section class="secao" aria-labelledby="titulo-dos-recomendados">
          <div class="cabecalho-da-secao">
            <img class="ornamento ornamento-divisor-curto" src="/imagens/ornamentos/divisor-curto-familia-a.svg" width="200" height="20" alt="" aria-hidden="true">
            <div class="linha-do-cabecalho-da-secao"><h2 class="titulo-de-secao" id="titulo-dos-recomendados">Recomendados para você</h2></div>
            <p class="texto-auxiliar">Com base nos santos que você visitou neste dispositivo.</p>
          </div>
          <div id="livros-recomendados"></div>
        </section>
        <section class="secao" aria-labelledby="titulo-do-catalogo">
          <div class="cabecalho-da-secao">
            <img class="ornamento ornamento-divisor-curto" src="/imagens/ornamentos/divisor-curto-familia-a.svg" width="200" height="20" alt="" aria-hidden="true">
            <div class="linha-do-cabecalho-da-secao"><h2 class="titulo-de-secao" id="titulo-do-catalogo">Catálogo</h2></div>
          </div>
          <div class="largura-de-leitura" style="margin-bottom:24px" id="filtro-por-santo"></div>
          <div id="catalogo-de-livros"></div>
        </section>
      </div>
    </main>
    <!-- o rodapé entra aqui (layout.js) -->
  </div>
  <noscript>O Fides precisa de JavaScript habilitado para funcionar.</noscript>
</body>
</html>
