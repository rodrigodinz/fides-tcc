<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Fides: santos, orações, novenas, livros e liturgia em um só lugar.">
  <meta name="theme-color" content="#EEE8DC">
  <link rel="icon" type="image/svg+xml" href="/imagens/simbolo-fides.svg">
  <title>Livros · Fides</title>
  <!-- estilos: fontes, cores e medidas (tokens), base, componentes e páginas -->
  <link rel="stylesheet" href="/css/fontes.css">
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/componentes.css">
  <link rel="stylesheet" href="/css/paginas.css">
  <!-- type="module": o script pode usar import/export e só roda depois que o HTML terminou de carregar -->
  <script type="module" src="/js/paginas/livros.js"></script>
</head>
<!-- Livros: recomendações e catálogo (livros.html?santo=...&pagina=...) -->
<!-- data-modulo diz qual link do menu fica marcado como página atual -->
<body data-modulo="livros">
  <div class="fd-app">
    <a href="#conteudo" class="fd-pular">Pular para o conteúdo</a>
    <!-- a navbar e o menu lateral entram aqui (layout.js) -->
    <main id="conteudo" tabindex="-1" class="fd-principal">
      <div class="fd-trilho fd-trilho--esq" aria-hidden="true"></div>
      <div class="fd-trilho fd-trilho--dir" aria-hidden="true"></div>
      <div class="fd-container fd-pagina">
        <header class="fd-cabecalho">
          <img class="fd-orn fd-orn--titulo" src="/imagens/ornamentos/titulo-familia-b.svg" width="516" height="40" alt="" aria-hidden="true">
          <h1 class="fd-h1">Livros</h1>
          <p class="fd-cabecalho__lead">Obras dos santos e textos importantes da fé, com resumo e contexto histórico.</p>
        </header>
        <section class="fd-secao" aria-labelledby="rec-titulo">
          <div class="fd-secao-titulo">
            <img class="fd-orn fd-orn--curto" src="/imagens/ornamentos/divisor-curto-familia-a.svg" width="200" height="20" alt="" aria-hidden="true">
            <div class="fd-secao-titulo__linha"><h2 class="fd-h2" id="rec-titulo">Recomendados para você</h2></div>
            <p class="fd-aux">Com base nos santos que você visitou neste dispositivo.</p>
          </div>
          <div id="livros-recomendados"></div>
        </section>
        <section class="fd-secao" aria-labelledby="cat-titulo">
          <div class="fd-secao-titulo">
            <img class="fd-orn fd-orn--curto" src="/imagens/ornamentos/divisor-curto-familia-a.svg" width="200" height="20" alt="" aria-hidden="true">
            <div class="fd-secao-titulo__linha"><h2 class="fd-h2" id="cat-titulo">Catálogo</h2></div>
          </div>
          <div class="fd-leitura" style="margin-bottom:24px" id="filtro-por-santo"></div>
          <div id="catalogo-de-livros"></div>
        </section>
      </div>
    </main>
    <!-- o rodapé entra aqui (layout.js) -->
  </div>
  <noscript>O Fides precisa de JavaScript habilitado para funcionar.</noscript>
</body>
</html>
